name: 04 - using - actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup Node
          uses: actions/setup-node@v3
          with:
            node-version: '26.x'
        - name: Install Dependencies
          run: npm ci
